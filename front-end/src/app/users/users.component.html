<section class="users">
  <h2>Users</h2>

  <form class="users__form" (ngSubmit)="createUser()">
    <input type="email" name="email" placeholder="Email" [(ngModel)]="newUserEmail" required />
    <input type="text" name="name" placeholder="Name" [(ngModel)]="newUserName" required />
    <button type="submit" [disabled]="submitting">Add user</button>
  </form>

  <p *ngIf="error" class="users__error">{{ error }}</p>
  <p *ngIf="loading">Loading...</p>

  <ul class="users__list" *ngIf="!loading">
    <li *ngFor="let user of users">
      <strong>{{ user.name }}</strong> - {{ user.email }}
    </li>
    <li *ngIf="users.length === 0">No users yet.</li>
  </ul>
</section>
