name: task1

x-rabbitmq-url: &rabbitmq_url
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: task1-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: task1-mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:latest
    container_name: task1-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  service-b:
    container_name: task1-service-b
    build:
      context: .
      dockerfile: back-end/service-b/Dockerfile
      target: runtime
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      <<: *rabbitmq_url
      SERVICE_NAME: service-b
      RABBITMQ_QUEUE: service_b_queue
      MONGODB_URI: mongodb://mongodb:27017/service_b
      PROCESSING_LOG_RETENTION_MS: 2592000000
      REDIS_URL: redis://redis:6379
      REPORT_DIR: /data/reports
    volumes:
      - report-storage:/data/reports
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"

  service-a:
    container_name: task1-service-a
    build:
      context: .
      dockerfile: back-end/service-a/Dockerfile
      target: runtime
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      <<: *rabbitmq_url
      SERVICE_NAME: service-a
      RABBITMQ_QUEUE: service_a_queue
      RABBITMQ_IMPORTS_QUEUE: service_a_imports_queue
      MONGODB_URI: mongodb://mongodb:27017/service_a
      MONGO_BATCH_SIZE: 500
      MONGO_INSERT_CONCURRENCY: 2
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/archives
      ARCHIVE_MAX_DECOMPRESSED_BYTES: 4294967296
      ARCHIVE_MAX_LINE_BYTES: 1048576
      SHUTDOWN_DRAIN_TIMEOUT_MS: 60000
    volumes:
      - archive-storage:/data/archives
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"

  api-gateway:
    container_name: task1-api-gateway
    build:
      context: .
      dockerfile: back-end/api-gateway/Dockerfile
      target: runtime
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "3000:3000"
    environment:
      <<: *rabbitmq_url
      SERVICE_NAME: api-gateway
      PORT: 3000
      RABBITMQ_SERVICE_B_QUEUE: service_b_queue
      RABBITMQ_SERVICE_A_QUEUE: service_a_queue
      RABBITMQ_SERVICE_A_IMPORTS_QUEUE: service_a_imports_queue
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/archives
      REPORT_DIR: /data/reports
      UPLOAD_RETENTION_MS: 86400000
      UPLOAD_SWEEP_INTERVAL_MS: 900000
    volumes:
      - archive-storage:/data/archives
      - report-storage:/data/reports
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"

volumes:
  archive-storage:
  report-storage:
