name: task1

x-rabbitmq-url: &rabbitmq_url
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: task1-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  service-b:
    container_name: task1-service-b
    build:
      context: .
      dockerfile: back-end/service-b/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *rabbitmq_url
      RABBITMQ_QUEUE: service_b_queue
    depends_on:
      rabbitmq:
        condition: service_healthy

  service-a:
    container_name: task1-service-a
    build:
      context: .
      dockerfile: back-end/service-a/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *rabbitmq_url
      RABBITMQ_QUEUE: service_a_queue
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    container_name: task1-gateway
    build:
      context: .
      dockerfile: back-end/gateway/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *rabbitmq_url
      PORT: 3000
      RABBITMQ_SERVICE_B_QUEUE: service_b_queue
      RABBITMQ_SERVICE_A_QUEUE: service_a_queue
    depends_on:
      rabbitmq:
        condition: service_healthy

  front-end:
    container_name: task1-front-end
    build:
      context: .
      dockerfile: front-end/Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - gateway
