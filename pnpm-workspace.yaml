packages:
  - "front-end"
  - "back-end/*"
  - "back-end/libs/*"

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true

packageExtensions:
  '@nestjs/terminus':
    peerDependencies:
      '@grpc/grpc-js': '*'
      '@grpc/proto-loader': '*'
      '@mikro-orm/core': '*'
      '@mikro-orm/nestjs': '*'
      '@nestjs/axios': ^2.0.0 || ^3.0.0 || ^4.0.0
      '@nestjs/common': ^10.0.0 || ^11.0.0
      '@nestjs/core': ^10.0.0 || ^11.0.0
      '@nestjs/microservices': ^10.0.0 || ^11.0.0
      '@nestjs/mongoose': ^11.0.0
      '@nestjs/sequelize': ^10.0.0 || ^11.0.0
      '@nestjs/typeorm': ^10.0.0 || ^11.0.0
      mongoose: '*'
      reflect-metadata: 0.1.x || 0.2.x
      rxjs: 7.x
      sequelize: '*'
      typeorm: '*'
    peerDependenciesMeta:
      '@grpc/grpc-js':
        optional: true
      '@grpc/proto-loader':
        optional: true
      '@mikro-orm/core':
        optional: true
      '@mikro-orm/nestjs':
        optional: true
      '@nestjs/axios':
        optional: true
      '@nestjs/microservices':
        optional: true
      '@nestjs/mongoose':
        optional: true
      '@nestjs/sequelize':
        optional: true
      '@nestjs/typeorm':
        optional: true
      mongoose:
        optional: true
      sequelize:
        optional: true
      typeorm:
        optional: true

injectWorkspacePackages: true
